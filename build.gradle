tasks.register('copyPlugins', Copy) {
	from subprojects.collect { it.tasks.withType(Jar) }
	exclude '**/Ikala-Core-*.jar'
	exclude '**/*-javadoc.jar'
	exclude '**/*-sources.jar'
    into 'plugins'
}

tasks.register('copyFramework', Copy) {
	from subprojects.collect { it.tasks.withType(Jar) }
	include '**/Ikala-Core-*.jar'
	exclude '**/*-javadoc.jar'
	exclude '**/*-sources.jar'
    into '.'
	doNotTrackState("We always want the latest jars")
}

// The shared libraries that plugins need, which are loaded once and never unloaded. This replaces
// everything in the folder, so that old versions of libraries don't stick around after upgrading.
tasks.register('copyLibraries', Sync) {
	from subprojects.collect { it.tasks.matching { task -> task.name == 'collectLibraries' } }
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into 'libs'
}

// The base game's content is the Lotomation plugin: a jar holding only its plugin.yml, with no
// code, and the plugins/Lotomation/data folder beside it
tasks.register('contentPlugin', Jar) {
	archiveBaseName = 'Lotomation'
	archiveVersion = '0.0.1-alpha'
	from('content') {
		include 'plugin.yml'
	}
	destinationDirectory = file('plugins')
	// copyFramework writes into this folder, which holds content/, so keep the two apart
	mustRunAfter copyFramework
}

tasks.register('build') {
	dependsOn copyPlugins, copyFramework, copyLibraries, contentPlugin
}

tasks.register('clean', Delete) {
    delete fileTree('.').matching {
        include 'plugins/*.jar'
		include 'libs/*.jar'
		include 'Ikala-Core-*.jar'
    }
}

